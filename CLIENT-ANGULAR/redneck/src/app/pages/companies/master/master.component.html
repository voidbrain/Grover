<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ table }}</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/{{ table }}/create"
        ><ion-icon name="add-circle"></ion-icon
      ></ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ table }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div id="container">
    <ion-list lines="inset">
      @for (item of items; track item) {
        <ion-item-sliding lines="inset" #slidingItem>
          <ion-item>
            <ion-label>
              <ion-item lines="none" (click)="showDetail(item)">
                <ion-icon name="business" slot="start"></ion-icon>
                <div [innerHtml]="item.name"></div>
              </ion-item>
            </ion-label>
          </ion-item>

          <ion-item-options side="end">
            <ion-item-option (click)="showDetail(item)">Edit</ion-item-option>
            <ion-item-option (click)="deleteItem(item)" color="danger"
              >Delete</ion-item-option
            >
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>
  </div>
</ion-content>
