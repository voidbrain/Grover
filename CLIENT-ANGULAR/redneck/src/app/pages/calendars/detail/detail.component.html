<ion-header>
  <ion-toolbar>
      <ion-buttons slot="start">
          <ion-button (click)="goBack()">
              <ion-icon name="arrow-back"></ion-icon>
          </ion-button>
      </ion-buttons>

      <ion-title>Add/edit {{ page }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content padding>
  <ion-refresher (ionRefresh)="doRefresh($event)">
      <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <form [formGroup]="form"  [hidden]=" !showForm ">
      <ion-input type="hidden" formControlName="id"></ion-input>
      <ion-input type="hidden" formControlName="deleted"></ion-input>
      <ion-input type="hidden" formControlName="lastUpdate"></ion-input>

      <ion-grid>
          <ion-row>
              <ion-col size='8'>
                  <ion-item>
                      <ion-label i18n color="primary">Name</ion-label>
                      <ion-input type="text" text-right i18n placeholder="Name" formControlName="name"></ion-input>
                  </ion-item>
              </ion-col>
              <ion-col size='4'>
                  <ion-item>
                      <ion-label i18n color="primary">Enabled</ion-label>
                      <ion-toggle formControlName="enabled"></ion-toggle>
                  </ion-item>
              </ion-col>
          </ion-row>
      </ion-grid>

      <ion-card>
          <ion-toolbar>
              <ion-buttons slot="end">
                  <ion-buttons>
                      <ion-button (click)=' showSubForm = true '><ion-icon name="add-circle"></ion-icon></ion-button>
                  </ion-buttons>
              </ion-buttons>
          </ion-toolbar>

          <form padding [hidden]=" !showSubForm ">
              <ion-grid>
                  <ion-row>
                      <ion-col size='5'>
                          <ion-item>
                              <ion-label i18n color="primary">Phase</ion-label>
                              <ion-select [(ngModel)]="newPhase.phase" name='phase' i18n placeholder="Phase">
                                @for (phase of phases; track phase.id) {
                                  <ion-select-option [value]="phase.id">{{phase.name}}</ion-select-option>
                                }
                              </ion-select>
                          </ion-item>
                      </ion-col>
                      <ion-col size='5'>
                          <ion-item>
                              <ion-label i18n color="primary">Duration</ion-label>
                              <ion-input [(ngModel)]="newPhase.duration" name='duration' type="number" text-right  i18n placeholder="Duration"></ion-input>
                          </ion-item>
                      </ion-col>
                      <ion-col size='2'>
                          <ion-button color="primary" i18n (click)="addPhase()">
                            Add
                          </ion-button>
                      </ion-col>
                  </ion-row>
              </ion-grid>
          </form>
          <ion-list>
              <ion-reorder-group (ionItemReorder)="reorder($event)" disabled="false">
                @for (phase of relatedPhases; track phase.id) {
                  <ion-item-sliding>
                      <ion-item>
                          <ion-label>{{ phase.name }}</ion-label>
                          <ion-reorder slot="start"></ion-reorder>

                          <div slot="end" class="canvasContainer">
                              <app-chart [chartConfig]="phase.chartConfig"></app-chart>
                          </div>

                          <div slot="end">
                            Days
                          </div>
                      </ion-item>

                      <ion-item-options side="end">
                          <ion-item-option (click)="deleteItem(phase)" color="danger">Delete</ion-item-option>
                      </ion-item-options>
                  </ion-item-sliding>
                }
              </ion-reorder-group>
          </ion-list>
      </ion-card>

      <ion-button i18n color="primary" expand="block" (click)="saveForm()" [hidden]=" !showForm " [disabled]=" !isReadyToSave ">
        Submit
      </ion-button>
  </form>

</ion-content>
