<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>Add/edit {{ page }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content padding>
  <form [formGroup]="form" [hidden]="!showForm">
    <ion-input type="hidden" formControlName="id"></ion-input>
    <ion-input type="hidden" formControlName="deleted"></ion-input>
    <ion-input type="hidden" formControlName="lastUpdate"></ion-input>

    <ion-item>
      <ion-label i18n color="primary">Name</ion-label>
      <ion-input
        i18n
        type="text"
        text-right
        placeholder="Name"
        formControlName="name"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label i18n color="primary">Lineage</ion-label>
      <ion-select
        i18n
        formControlName="lineage"
        multiple="true"
        cancelText="Cancel"
        okText="Confirm"
        placeholder="Lineage"
      >
        @for (strain of strains; track strain.id) {
          <ion-select-option [value]="strain.id">{{
            strain.name
          }}</ion-select-option>
        }
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label i18n color="primary">% Sativa</ion-label>
      <ion-badge>{{ form.get("percentSativa")?.value }}</ion-badge>
      <ion-range min="0" max="100" formControlName="percentSativa">
        <ion-icon size="small" slot="start" name="sunny"></ion-icon>
        <ion-icon slot="end" name="sunny"></ion-icon>
      </ion-range>
    </ion-item>

    <ion-item>
      <ion-label i18n color="primary">enabled</ion-label>
      <ion-toggle formControlName="enabled"></ion-toggle>
    </ion-item>

    <ion-button
      i18n
      color="primary"
      expand="block"
      (click)="saveForm()"
      [hidden]="!showForm"
      [disabled]="!isReadyToSave"
    >
      Submit
    </ion-button>
  </form>
</ion-content>
