<ion-item class="dynamic-field app-input-select" [formGroup]="group">
    <ion-label color="primary">{{ config.label }}</ion-label>
    <ion-select
      multiple="{{ config.multiple }}"
      [formControlName]="config.name"
    >
      <ion-select-option
        *ngFor="let option of config.options"
        [value]="option.id"
      >
        {{ option.name }}
      </ion-select-option>
    </ion-select>
  </ion-item>
