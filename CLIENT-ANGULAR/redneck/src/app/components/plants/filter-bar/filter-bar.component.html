
<ion-card>
  <ion-card-content>
    <div class="app-input-select">
      <ion-grid>
        <ion-row>
          <ion-col class="ion-text-center" *ngFor="let option of config.options">
            <ion-checkbox class="ion-no-padding ion-no-margin" (ionChange)="updateSelection($event)" [checked]="option.isChecked" [value]="option.id"></ion-checkbox>
            <br /><ion-label color="primary">{{ option.name }}</ion-label>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
  </ion-card-content>
</ion-card>
