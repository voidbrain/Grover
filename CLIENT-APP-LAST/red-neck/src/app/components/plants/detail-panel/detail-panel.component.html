  <ion-grid>

    <ion-row>
      <ion-col class="ion-no-padding" size="12">
        <ion-card class="ion-no-margin-top ion-no-padding-bottom">
          <ion-card-content class="ion-no-padding-bottom">
            <ion-segment  value="schedule" (ionChange)="setViewComponent($event)">
              <ion-segment-button value="schedule">
                <ion-label>Schedule</ion-label>
              </ion-segment-button>
              <ion-segment-button value="log">
                <ion-label>Logs</ion-label>
              </ion-segment-button>
            </ion-segment>
            <br />
            <app-schedule-panel [hidden]="hideSchedule" [plant]="plant" [room]="room"></app-schedule-panel>
            <app-log-panel [hidden]="hideLog" [plant]="plant" [room]="room"></app-log-panel>
          </ion-card-content>
        </ion-card>
      </ion-col>
      <ion-col size="12" class="ion-padding-right">
        <app-phase-details [plant]="plant" [room]="room"></app-phase-details>
      </ion-col>
    </ion-row>
  </ion-grid>
