<div class="range-container ">
  <span class="ion-float-left text-bottom text-danger">{{ minValue }}</span>
  <span class="ion-float-right text-bottom text-danger">{{ maxValue }}</span>
  <div class="range-warning-values "
    [style.marginLeft]="percentMinWarningValue + '%'"
    [style.width]="percentMaxWarningValue - percentMinWarningValue + '%'"
  >
    <span class="ion-float-left text-bottom text-success">{{ (+minValue !== +minWarningValue ? minWarningValue : '') }}</span>
    <span class="ion-float-right text-bottom text-success">{{ (+maxValue !== +maxWarningValue ? maxWarningValue : '') }}</span>
  </div>
  <div [style.left]="(percentValue > minValue ? (percentValue < maxValue ? percentValue : maxValue) : minValue) + '%'"
    [class]="'value ' + (+value >= +minWarningValue && +value <= +maxWarningValue ? '' : 'warning')">
    <div class="text-top">{{ value }} {{um}}</div>
  </div>
</div>
