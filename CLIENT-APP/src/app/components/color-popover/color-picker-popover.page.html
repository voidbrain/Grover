<ion-list #theList inset="false" lines="full" class="noPadBottom">
	<ion-grid>
		<ion-row class="rowClass">
			@for (item of colorService.colorList; track item.value) {
				<ion-col size="2" class="colClass" [style.background]="item.value"
					(click)="selectColor(i)">
				</ion-col>
			}
		</ion-row>
	</ion-grid>
</ion-list>
