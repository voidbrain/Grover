<ion-content padding>
    <ion-card class="ion-margin-bottom">
        <div class="filters">
            <ion-grid>
                <ion-row>
                    <ion-col>
                        <ion-item>
                            <ion-label>From</ion-label>
                            <ion-datetime (ionChange)=' filterReport($event) ' [(ngModel)]="form.dateFrom" picker-format="DD MMM YYYY" display-format="DD MMM YYYY"></ion-datetime>
                        </ion-item>
                    </ion-col>
                    <ion-col>
                        <ion-item>
                            <ion-label>To</ion-label>
                            <ion-datetime (ionChange)=' filterReport($event) ' [(ngModel)]="form.dateTo" picker-format="DD MMM YYYY" display-format="DD MMM YYYY"></ion-datetime>
                        </ion-item>
                    </ion-col>
                    <ion-col [hidden]=' subject '>
                        <ion-item>
                            <ion-label>Containers</ion-label>
                            <ion-select multiple="true" (ionChange)=' filterReport($event) ' [(ngModel)]="form.containers" placeholder="Select Container">
                                <!-- <ion-select-option (ionChange)="selectAll()" value="">Select All</ion-select-option> -->
                                <ion-select-option *ngFor="let container of default.containers" value="{{ container.id }}">{{ container.name }}</ion-select-option>
                            </ion-select>
                        </ion-item>
                    </ion-col>
                    <ion-col>
                        <ion-item>
                            <ion-label>Probes</ion-label>
                            <ion-select multiple="true" (ionChange)=' filterReport($event) ' [(ngModel)]="form.probesType" placeholder="Select Probe">
                                <!-- <ion-select-option [(ngModel)]="probesType" (ionClick)="selectAll()" (ionChange)="selectAll()" value="">Select All</ion-select-option> -->
                                <ion-select-option *ngFor="let type of default.probesType"  value="{{ type.id }}">{{ type.type }}</ion-select-option>
                            </ion-select>
                        </ion-item>
                    </ion-col>
                </ion-row>
            </ion-grid>
        </div>
    </ion-card>

    <ion-card *ngFor="let container of containers">
        <ion-card-title padding>
            {{ container.name }}
        </ion-card-title>

        <div class="canvasContainer"> 
            <chart [chartConfig]="container.chartConfig"></chart>
        </div>

        <!-- <ion-card-content>
            <div *ngFor="let probe of container.probes">
                <ion-item>{{ probe.type.type }}</ion-item>
                <ion-grid>
                    <ion-row *ngFor="let log of probe.log">
                        <ion-col size="6">{{ log.datetime | date : 'd/M HH:mm' }}</ion-col>
                        <ion-col size="6">{{ log.value }}</ion-col>
                    </ion-row>
                </ion-grid>
            </div>
        </ion-card-content> -->
    </ion-card>
</ion-content>
