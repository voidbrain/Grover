<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-menu-toggle>
                <ion-button><ion-icon slot="icon-only" name="menu"></ion-icon></ion-button>
            </ion-menu-toggle>  
        </ion-buttons>
        <ion-title>{{ table }}</ion-title>
        <ion-buttons slot="end">
            <ion-button routerLink="/{{ table }}/create"><ion-icon name="add-circle"></ion-icon></ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content padding>
    <ion-refresher (ionRefresh)="doRefresh($event)">
        <ion-refresher-content></ion-refresher-content>
    </ion-refresher>

    <ion-list>
        @for (item of items; track item.id) {
            <ion-item-sliding #slidingItem>
                <ion-item>
                    <ion-label>
                        <ion-item lines="none" (click)="showDetail(item)">
                            <ion-icon name="calendar" slot="start"></ion-icon>
                            <div [innerHtml]=" item.name "></div>
                        </ion-item>
                    </ion-label>

                    <div slot="end">Weeks
                        <div class="canvasContainer"> 
                            <app-chart [chartConfig]="item.chartConfig"></app-chart>
                        </div>
                    </div>
                </ion-item>

                <ion-item-options side="end">
                    <ion-item-option (click)="showDetail(item)">Edit</ion-item-option>
                    <ion-item-option (click)="deleteItem(item)" color="danger">Delete</ion-item-option>
                </ion-item-options>
            </ion-item-sliding>
        }
    </ion-list>
</ion-content>
