name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'CLIENT-ANGULAR/redneck/**'
      - '.github/workflows/deploy-angular-to-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: CLIENT-ANGULAR/redneck
        run: npm ci

      - name: Build Angular app for GitHub Pages
        working-directory: CLIENT-ANGULAR/redneck
        run: npm run build:github-pages

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: CLIENT-ANGULAR/redneck/dist/redneck/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
